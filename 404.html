<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add("js")</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ページが見つかりません | ELLA WEB</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF8F4">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" as="image" href="/images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&family=Schibsted+Grotesk:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&family=Schibsted+Grotesk:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&family=Schibsted+Grotesk:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap"></noscript>
<style>
:root{--fv:none;--photo:none;--strip:none;--logo:url(/images/logo.webp);--ivory:#FAF8F4;--paper:#F3F1EC;--mist:#EFF2F7;--ink:#141517;--ink2:#3A3C40;--mute:#6B6E73;--line:#DCD9D2;--blue:#1E6BFF;--blue2:#1450E0;--navy:#0D1B3E;
--serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--sans:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;--latin:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
--pad:clamp(24px,6vw,96px);--e-out:cubic-bezier(.16,1,.3,1);--e-io:cubic-bezier(.65,0,.35,1);--e-soft:cubic-bezier(.22,1,.36,1)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);line-break:strict;-webkit-font-smoothing:antialiased;overflow-x:clip}
img{display:block;max-width:100%}
a{color:inherit}
a:focus-visible,button:focus-visible,summary:focus-visible,.wc:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--pad)}
.sec{position:relative;padding:clamp(120px,16vw,240px) 0}
.label{display:flex;align-items:center;gap:16px;font-family:var(--latin);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin:0 0 clamp(28px,3vw,40px)}
.label i{font-style:normal;color:var(--blue)}
.label::after{content:"";flex:0 0 48px;height:1px;background:currentColor;opacity:.5}
.h-latin{margin:0;font-family:var(--latin);font-weight:400;font-size:clamp(64px,11vw,176px);line-height:.92;letter-spacing:-.035em;color:var(--ink)}
.lead{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(26px,3vw,44px);line-height:1.6;letter-spacing:.04em}
.body{font-size:15.5px;line-height:2.2;color:var(--ink2);letter-spacing:.04em}
.body p{margin:0 0 1.5em}.body p:last-child{margin:0}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 40px;margin-bottom:clamp(64px,8vw,120px)}
.sec-head .sub{margin:0;font-family:var(--serif);font-size:clamp(16px,1.4vw,19px);letter-spacing:.1em;color:var(--ink2)}

/* header */
.hdr{position:absolute;inset:0 0 auto 0;z-index:30}
.hdr .menu-btn{border:0;width:44px}
.hdr .menu-btn i{width:34px}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px var(--pad);max-width:1600px;margin:0 auto}
.logo{display:inline-flex;line-height:0;flex:0 0 auto}
.logo-mark{display:block;height:96px;aspect-ratio:640/587;background:var(--logo) center/contain no-repeat}
.bgimg{width:100%;height:100%;background-size:cover;background-repeat:no-repeat}.hero-img{background-image:var(--photo);background-position:62% 55%}.strip-img{background-image:var(--strip);background-position:50% 60%}.c-img{background-image:var(--fv);background-position:88% 50%}
.nav{display:flex;align-items:center;gap:clamp(24px,2.6vw,44px)}
.nav-links{display:flex;gap:clamp(20px,2.4vw,40px)}
.nav-links a{position:relative;text-decoration:none;font-family:var(--latin);font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--blue);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--e-io)}
.hdr .menu-btn{display:inline-flex}
.hdr::before{content:"";position:absolute;inset:0 0 -40px 0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(250,248,244,.92),rgba(250,248,244,.55) 60%,transparent)}
.pill-tx{white-space:nowrap}
/* pill CTA */
.pill{--h:64px;position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:18px;min-height:var(--h);padding:0 30px 0 12px;border-radius:999px;text-decoration:none;font-family:var(--sans);font-weight:500;font-size:15px;letter-spacing:.12em;color:#fff;background:linear-gradient(100deg,#3D7BFF 0%,var(--blue) 45%,var(--blue2) 100%);box-shadow:0 18px 40px -18px rgba(30,107,255,.6);transition:transform .6s var(--e-out),box-shadow .6s var(--e-out)}
.pill::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--navy);transform:translateX(-101%);transition:transform .7s var(--e-io)}
.pill-ic{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--blue);display:inline-flex;align-items:center;justify-content:center}
.pill .arw{flex:0 0 auto;transition:transform .6s var(--e-out)}
.pill.dark{background:var(--navy);box-shadow:none;border:1px solid rgba(255,255,255,.18)}
.pill.dark::before{background:var(--blue)}
.pill.dark .pill-ic{color:var(--navy)}
.pill.sm{--h:52px;font-size:13px;padding:0 22px 0 8px;gap:14px}.pill.sm .pill-ic{width:36px;height:36px}
.pill.light{background:#fff;color:var(--ink);box-shadow:none}
.pill.light .pill-ic{background:var(--ink);color:#fff}
.pill.light::before{background:var(--blue)}
.text-link{position:relative;display:inline-flex;align-items:center;gap:14px;text-decoration:none;font-family:var(--latin);font-size:12px;font-weight:500;letter-spacing:.22em;min-height:44px}
.text-link::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:currentColor;opacity:.35}
.text-link::before{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:var(--blue);transform:scaleX(0);transform-origin:right;transition:transform .55s var(--e-io);z-index:1}
.text-link .arr{display:inline-block;transition:transform .5s var(--e-out)}
@media (hover:hover){
 .nav-links a:hover::after,.text-link:hover::before{transform:scaleX(1);transform-origin:left}
 .pill:hover{transform:translateY(-2px) scale(1.025);box-shadow:0 24px 50px -20px rgba(30,107,255,.7)}
 .pill:hover::before{transform:none}
 .pill.light:hover{color:#fff}
 .pill:hover .arw{transform:translateX(6px)}
 .text-link:hover .arr{transform:translate(4px,-4px)}
}

/* hero */
.hero{position:relative;min-height:max(720px,100svh);display:flex;align-items:center;overflow:hidden;background:var(--ivory);isolation:isolate}
.hero-media{position:absolute;inset:0;z-index:-1;overflow:hidden}
.fv-img{background-image:var(--fv);background-position:62% 50%}
.hero-media::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(250,248,244,.42) 0%,rgba(250,248,244,.22) 30%,rgba(250,248,244,0) 50%)}
.hero-media .pz{position:absolute;inset:-6% 0;will-change:transform}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:62% 55%}
.hero-media .sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.38) 48%,transparent 60%);transform:translateX(-120%);mix-blend-mode:soft-light}
.hero::before{content:"";position:absolute;z-index:2;inset:0;background:#FAF8F4;pointer-events:none;animation:veil 1.6s var(--e-io) .05s both}
@keyframes veil{from{opacity:1}to{opacity:0;visibility:hidden}}
.hero-copy{position:relative;z-index:3;width:100%;max-width:1600px;margin:0 auto;padding:clamp(150px,19vh,190px) var(--pad) clamp(90px,12vh,130px)}
.hero h1{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(40px,min(5.4vw,9.6vh),92px);line-height:1.34;letter-spacing:.02em;color:var(--ink)}
.hero h1 .ln{display:block;overflow:hidden;padding:.04em .1em .08em 0;margin:-.04em 0 -.08em}
.hero h1 .ln.blue .ch{background:linear-gradient(180deg,#4A86FF 0%,var(--blue) 50%,var(--blue2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 .ch{display:inline-block;will-change:transform}
.hero-sub{margin:clamp(28px,4.4vh,48px) 0 0;padding-left:26px;border-left:1px solid var(--ink);font-family:var(--serif);font-size:clamp(14px,1.15vw,17px);line-height:2.1;letter-spacing:.2em;color:var(--ink2)}
.hero-cta{margin-top:clamp(28px,5vh,52px)}
.scroll-ind{z-index:3;position:absolute;left:clamp(16px,2.4vw,40px);bottom:36px;display:flex;flex-direction:column;align-items:center;gap:12px;font-family:var(--latin);font-size:10px;letter-spacing:.3em;color:var(--ink2)}
.scroll-ind span{position:relative;width:1px;height:56px;background:rgba(20,21,23,.25);overflow:hidden}
.scroll-ind span::after{content:"";position:absolute;left:0;top:0;width:1px;height:40%;background:var(--ink);animation:scrollLine 2.4s var(--e-io) 2.4s infinite}
@media (max-height:860px){.scroll-ind{display:none}}
@keyframes scrollLine{0%{transform:translateY(-100%)}100%{transform:translateY(260%)}}

/* about */
.about-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(48px,7vw,140px);align-items:start;margin-top:clamp(64px,8vw,112px)}
.about .body{max-width:34em}
.figure{position:relative;overflow:hidden;margin:clamp(120px,14vw,200px) 0 0}
.figure .pz{will-change:transform}
.logo-fig{background:var(--paper)}
.logo-stage{display:flex;align-items:center;justify-content:center;height:clamp(360px,40vw,600px)}
.logo-big{height:62%;width:auto;aspect-ratio:909/834}
html.js .rv-img .logo-big{transform:scale(.9);opacity:0;transition:transform 2.2s var(--e-out),opacity 1.6s ease .2s}
html.js .rv-img.is-in .logo-big{transform:none;opacity:1}
html.js .logo-fig.rv-img{clip-path:inset(10% 0 10% 0);transition:clip-path 1.8s var(--e-io)}
html.js .logo-fig.rv-img.is-in{clip-path:inset(0)}
.figure .strip-img{height:clamp(260px,34vw,520px)}
.features{margin-top:clamp(100px,12vw,180px);border-top:1px solid var(--ink)}
.feat{display:grid;grid-template-columns:120px minmax(0,1.1fr) minmax(0,1fr);gap:24px clamp(32px,4vw,72px);align-items:baseline;padding:clamp(44px,5vw,72px) 0;border-bottom:1px solid var(--line)}
.feat .no{font-family:var(--latin);font-size:13px;letter-spacing:.2em;color:var(--blue)}
.feat .en{margin:0 0 14px;font-family:var(--latin);font-size:11.5px;letter-spacing:.24em;color:var(--mute)}
.feat h3{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(24px,2.5vw,36px);line-height:1.5;letter-spacing:.04em}
.feat p.t{margin:0;font-size:15px;line-height:2.1;color:var(--ink2)}

/* works */
.works{background:var(--paper);overflow:hidden}
.wc{position:relative;outline:none;--cw:min(380px,28vw);--gap:1.08}
.wc-stage{display:grid;perspective:1800px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.wc-stage.dragging{cursor:grabbing}
.wc-card{grid-area:1/1;justify-self:center;width:var(--cw);transform-style:preserve-3d;transition:transform 1.1s var(--e-soft),opacity .9s var(--e-out);will-change:transform}
.wc-stage.dragging .wc-card{transition:none}
.wc-shot{display:block;text-decoration:none;color:inherit;background:#fff;padding:10px;box-shadow:0 40px 80px -50px rgba(20,21,23,.45);transition:transform .8s var(--e-out),box-shadow .8s var(--e-out)}
.wc-shot .frame{overflow:hidden;background:#fff;aspect-ratio:720/1288;display:flex;align-items:center;justify-content:center}
.wc-shot .frame img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.wc-shot .ph{font-size:12px;letter-spacing:.16em;color:var(--mute);transition:transform 1.4s var(--e-out)}
.wc-shot .frame > *{transition:transform 1.4s var(--e-out)}
.wc-info{display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding-top:clamp(28px,3vw,44px);transition:opacity .6s ease,transform .8s var(--e-out)}
.wc-card:not(.is-center) .wc-info{opacity:0;transform:translateY(16px)}
.wc-info .no{font-family:var(--latin);font-size:13px;letter-spacing:.2em;color:var(--blue);margin-right:22px}
.wc-info .nm{margin:0 0 10px;font-family:var(--serif);font-weight:500;font-size:clamp(22px,2.4vw,34px);letter-spacing:.04em}
.wc-info .ct{margin:0;font-family:var(--latin);font-size:12.5px;letter-spacing:.14em;color:var(--mute)}
.wc-card.settle .wc-shot{animation:settle 1.1s var(--e-out)}
@keyframes settle{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
@media (hover:hover){.wc-card.is-center .wc-shot:hover{transform:translateY(-10px);box-shadow:0 60px 100px -50px rgba(20,21,23,.5)}.wc-card.is-center .wc-shot:hover .frame > *{transform:scale(1.04)}}
.wc-ui{display:flex;align-items:center;gap:20px;margin-top:clamp(40px,5vw,72px)}
.wc-btn{flex:0 0 auto;width:56px;height:56px;border-radius:50%;border:1px solid var(--ink);background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;transition:color .4s,border-color .4s,transform .5s var(--e-out)}
.wc-btn::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--blue);transform:scale(0);transition:transform .55s var(--e-out);z-index:-1}
.wc-btn svg{transition:transform .5s var(--e-out)}
@media (hover:hover){.wc-btn:hover{color:#fff;border-color:var(--blue)}.wc-btn:hover::before{transform:scale(1)}.wc-btn.next:hover svg{transform:translateX(3px)}.wc-btn.prev:hover svg{transform:translateX(-3px)}}
.wc-btn:active{transform:scale(.92)}
.wc-count{font-family:var(--latin);font-size:13px;letter-spacing:.16em;color:var(--mute);font-variant-numeric:tabular-nums;min-width:70px}
.wc-count b{font-weight:500;color:var(--ink)}
.wc-bar{flex:1 1 auto;height:1px;background:var(--line);position:relative;overflow:hidden}
.wc-bar span{position:absolute;inset:0;background:var(--blue);transform-origin:left;transition:transform .9s var(--e-io)}

/* price */
.price-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(56px,8vw,140px)}
.plan .tag{margin:0 0 28px;font-family:var(--latin);font-size:12px;letter-spacing:.24em;color:var(--mute)}
.plan .amt{margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:10px}
.plan .num{font-family:var(--latin);font-weight:400;letter-spacing:-.03em;line-height:1}
.plan .yen{font-family:var(--serif);font-size:20px}
.plan-main{border-top:1px solid var(--ink);padding-top:40px}
.plan-main .num{font-size:clamp(72px,8.4vw,128px)}
.plan-sub{border-top:1px solid var(--ink);padding-top:40px;align-self:start}
.plan-sub .num{font-size:clamp(48px,5vw,72px)}
.incl{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}
.incl li{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);font-size:15px;letter-spacing:.04em}
.incl li::before{content:"";flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.plan-sub .desc{margin:32px 0 0;font-size:15px;line-height:2.1;color:var(--ink2);max-width:24em}
.plan-sub .note{margin:56px 0 0;padding-top:24px;border-top:1px solid var(--line);font-size:13px;line-height:1.9;color:var(--mute)}
.plan .cta-row{margin-top:48px}

/* flow */
.flow{background:var(--mist)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative}
.steps::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(20,21,23,.2)}
.steps .prog{position:absolute;left:0;right:0;top:0;height:1px;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform 2.2s var(--e-io) .3s}
.steps.is-in .prog{transform:scaleX(1)}
.step{position:relative;padding:44px 24px 0 0}
.step::before{content:"";position:absolute;left:0;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--mist);border:1px solid var(--ink)}
.step .no{margin:0 0 48px;font-family:var(--latin);font-size:13px;letter-spacing:.2em;color:var(--blue)}
.step .en{margin:0 0 12px;font-family:var(--latin);font-size:11.5px;letter-spacing:.22em;color:var(--mute)}
.step .jp{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(17px,1.35vw,20px);line-height:1.75;letter-spacing:.04em}

/* faq */
.faq-grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(48px,7vw,120px)}
.faq-list{border-top:1px solid var(--ink)}
.faq{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;align-items:center;gap:24px;padding:32px 0;cursor:pointer;font-family:var(--serif);font-weight:500;font-size:clamp(16px,1.4vw,19px);line-height:1.8;letter-spacing:.04em;transition:color .4s}
.faq summary::-webkit-details-marker{display:none}
.faq .q{flex:0 0 auto;font-family:var(--latin);font-size:13px;color:var(--blue);letter-spacing:.1em}
.faq .qt{flex:1 1 auto}
.faq .ic{flex:0 0 auto;position:relative;width:18px;height:18px;transition:transform .5s var(--e-out)}
.faq .ic::before,.faq .ic::after{content:"";position:absolute;background:var(--ink);transition:opacity .4s}
.faq .ic::before{left:0;top:8.5px;width:18px;height:1px}.faq .ic::after{left:8.5px;top:0;width:1px;height:18px}
.faq[open] .ic{transform:rotate(180deg)}.faq[open] .ic::after{opacity:0}
.faq .ans{display:flex;gap:24px;padding:0 40px 36px 0;animation:ansIn .6s var(--e-out)}
.faq .ans .a{flex:0 0 auto;font-family:var(--latin);font-size:13px;color:var(--mute)}
.faq .ans p{margin:0;font-size:15px;line-height:2.1;color:var(--ink2)}
@keyframes ansIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (hover:hover){.faq summary:hover{color:var(--blue)}}

/* contact */
.contact{background:#0F1115;color:#fff;overflow:hidden;isolation:isolate;padding-bottom:0}
.contact-media{position:absolute;inset:0 0 0 auto;width:55%;z-index:-1;opacity:.42;-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}
.contact-media .pz{position:absolute;inset:-8% 0}
.contact-media img{width:100%;height:100%;object-fit:cover;object-position:65% 50%}
.contact .label{color:rgba(255,255,255,.6)}
.contact .h-latin{color:#fff}
.contact-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:56px;margin-top:clamp(56px,6vw,88px)}
.contact .lead{color:#fff}
.contact .desc{margin:28px 0 0;font-size:15px;line-height:2.2;color:rgba(255,255,255,.7);letter-spacing:.04em}
.contact .cta-col{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.contact .cta-col small{font-size:13px;color:rgba(255,255,255,.62);letter-spacing:.06em}
.ftr{margin-top:clamp(120px,14vw,200px);border-top:1px solid rgba(255,255,255,.14)}
.co{position:relative;background:#0F1115;margin-top:clamp(120px,14vw,200px);border-top:1px solid rgba(255,255,255,.14);padding-top:clamp(72px,8vw,120px)}
.co + .ftr{position:relative;background:#0F1115}
.co .nb{display:inline-block}
.co + .ftr{margin-top:0}
.co{padding-bottom:clamp(88px,10vw,140px)}
.co-grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(40px,7vw,120px);align-items:start}
.co-title{margin:0;font-family:var(--serif);font-weight:500;font-size:clamp(24px,2.4vw,32px);letter-spacing:.12em;color:#fff}
.co-list{margin:0;border-top:1px solid rgba(255,255,255,.32)}

    cards.forEach(function(c, i){
      var o = off(i), a = Math.abs(o);

      c.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + (a ? 24 : 0) + 'px,' + (a ? -260 : 0) + 'px) rotateY(' + (-o*4) + 'deg) scale(' + (a ? .8 : 1) + ')';

    if (!down || e.pointerId !== pid) return;

  }
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  stage.addEventListener('click', function(e){
    if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; return; }
    var card = e.target.closest('.wc-card');
    if (card && !card.classList.contains('is-center')) { e.preventDefault(); go(cards.indexOf(card)); }
  }, true);
  stage.addEventListener('dragstart', function(e){ e.preventDefault(); });
  window.addEventListener('resize', layout, { passive: true });
  layout();
})();
